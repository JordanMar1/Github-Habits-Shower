<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Séries d'activité GitHub</title>
</head>
<body>
  <button id="login">Se connecter avec GitHub</button>
  <button id="logout" hidden>Se déconnecter</button>
  <button id="refresh" hidden>Actualiser</button>
  <p id="status"></p>
  <pre id="result"></pre>

  <script type="module">
    import { supabase, login, logout } from "./connexion.js";
    import { fetchDates, toDays } from "./activite.js";
    import { computeStreaks } from "./compute_streak.js";

    const LABELS = {
      pr: { title: "Pull requests", img: "assets/orange.jpg", color: { r: 255, g: 127, b: 0 } },
      review: { title: "Reviews de PR", img: "assets/blueberries.png", color: { r: 0, g: 0, b: 255 } },
      issue: { title: "Issues", img: "assets/apple.jpg", color: { r: 255, g: 0, b: 0 } },
      //discussion: { title: "Discussions", img:"assets/banana.jpg", color: { r: 255, g: 255, b:0 }}
    };

    const $ = id => document.getElementById(id);

    const render = stats =>
      Object.entries(LABELS).map(([t, { title, img: imgSrc, color }]) => {
        const item = stats[t]?.[0] || { current: 0, longest: 0 };
        const intensity = Math.min(item.current / 365, 1);
        const rgbString = `${color.r}, ${color.g}, ${color.b}`;

        return `
          <div class="stat-card" style="text-align: center; margin-bottom: 1rem;">
            <!-- Conteneur pour l'image teintée -->
            <div style="
              width: 50px;
              height: 50px;
              margin: 0 auto 0.5rem;
              mask-image: url('${imgSrc}');
              -webkit-mask-image: url('${imgSrc}');
              mask-size: contain;
              -webkit-mask-size: contain;
              mask-repeat: no-repeat;
              -webkit-mask-repeat: no-repeat;
              background-color: rgb(${rgbString});
              opacity: ${0.3 + (intensity * 0.7)}; /* L'opacité ou l'intensité varie selon l'activité (min 0.3) */
            "></div>
            <div>
              <strong>${title}</strong> : série en cours ${item.current} j, plus longue ${item.longest} j
            </div>
          </div>
        `;
      }).join("");

    async function compute(pseudo, token) {
      const to = new Date();
      const from = new Date(Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), to.getUTCDate() - 364));
      const types = Object.keys(LABELS);
      const results = await Promise.all(types.map(t => fetchDates(pseudo, token, t, from, to)));
      const stats = {};
      types.forEach((t, i) => { stats[t] = computeStreaks(toDays(results[i], from, to)); });
      return stats;
    }

    async function save(userId, stats) {
      const { error } = await supabase.from("streaks")
        .upsert({ user_id: userId, stats, updated_at: new Date().toISOString() });
      if (error) console.warn("Sauvegarde impossible :", error.message);
    }

    async function loadSaved(userId) {
      const { data } = await supabase.from("streaks")
        .select("stats, updated_at").eq("user_id", userId).maybeSingle();
      return data;
    }

    let lastToken = null;

    supabase.auth.onAuthStateChange(async (event, session) => {
      const connected = !!session;
      $("login").hidden = connected;
      $("logout").hidden = !connected;
      $("refresh").hidden = !connected;
      if (!connected) { $("status").textContent = ""; $("result").textContent = ""; lastToken = null; return; }

      const pseudo = session.user.user_metadata.user_name;
      const token = session.provider_token;
      if (token && token !== lastToken) {
        lastToken = token;
        $("status").textContent = `Connecté : ${pseudo}. Chargement...`;
        try {
          const stats = await compute(pseudo, token);
          $("result").innerHTML = render(stats);
          $("status").textContent = `Connecté : ${pseudo}. Données à jour.`;
          await save(session.user.id, stats);
        } catch (e) {
          $("status").textContent = "Erreur : " + e.message;
        }
      } else if (!token && !lastToken) {
        const saved = await loadSaved(session.user.id);
        if (saved) {
          $("result").innerHTML = render(saved.stats);
          $("status").textContent = `Connecté : ${pseudo}. Dernière mise à jour : ${new Date(saved.updated_at).toLocaleString("fr-FR")}. Clique sur « Actualiser » pour recalculer.`;
        } else {
          $("status").textContent = `Connecté : ${pseudo}. Clique sur « Actualiser » pour charger tes données.`;
        }
      }
    });

    $("login").addEventListener("click", login);
    $("refresh").addEventListener("click", login);
    $("logout").addEventListener("click", logout);
  </script>
</body>
</html>
